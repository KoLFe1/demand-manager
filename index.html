<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17171a" media="(prefers-color-scheme: dark)">
<meta name="description" content="Demand Manager — demandas, tarefas, prazos e tempo, com uso offline e sincronização entre dispositivos.">

<meta name="apple-mobile-web-app-title" content="Demandas">

<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-maskable.svg">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/kit.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/shared.css">
<link rel="stylesheet" href="css/panels.css">
<link rel="stylesheet" href="css/views/dashboard.css">
<link rel="stylesheet" href="css/views/semana.css">
<link rel="stylesheet" href="css/views/demandas.css">
<link rel="stylesheet" href="css/views/kanban.css">
<link rel="stylesheet" href="css/views/aguardando.css">
<link rel="stylesheet" href="css/views/calendario.css">
<link rel="stylesheet" href="css/views/hierarquia.css">
<link rel="stylesheet" href="css/views/backlog.css">
<link rel="stylesheet" href="css/views/dependencias.css">
<link rel="stylesheet" href="css/views/cronograma.css">
<link rel="stylesheet" href="css/views/tempo.css">
<link rel="stylesheet" href="css/views/metricas.css">
<link rel="stylesheet" href="css/views/relatorio.css">
<link rel="stylesheet" href="css/views/config.css">
<script>
  // Aplica o tema salvo antes da primeira pintura (sem piscar). A chave é a mesma de app.prefs ('theme'),
  // com o prefixo do banco isolado quando a URL traz ?db=NOME.
  (function () {
    try {
      var ns = (new URLSearchParams(location.search).get('db') || '').trim().replace(/[^A-Za-z0-9._-]/g, '').slice(0, 80);
      var raw = localStorage.getItem((ns ? ns + ':' : '') + 'dm.pref.theme');
      var theme = raw ? JSON.parse(raw) : null;
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch (e) { /* sem armazenamento: segue a preferência do sistema */ }
  })();
</script>
</head>
<body>
<div id="app">
  <div class="boot-splash" role="status" aria-live="polite">
    <img class="boot-splash-icon" src="assets/icon.svg" width="44" height="44" alt="">
    <span class="boot-splash-text">Abrindo o Demand Manager…</span>
  </div>
</div>
<noscript>
  <p class="boot-noscript">O Demand Manager precisa de JavaScript para funcionar. Ative o JavaScript no navegador e recarregue a página.</p>
</noscript>
<script>
  // Vigia da abertura: erro num módulo importado por main.js acontece antes de boot() e a tela de erro do boot
  // nunca aparece. Se um script/módulo falhar ao carregar, ou se em 10 s o app não ficar pronto (DM.ready), troca
  // a abertura por um aviso com "Recarregar" e "Limpar cache e recarregar". Só age enquanto a abertura
  // (.boot-splash) ainda está na tela: a casca e a tela de erro do boot a substituem. Se o app terminar de abrir
  // depois do aviso de demora, o aviso some sozinho. "Limpar cache" apaga SÓ os caches 'dm-shell*' e o service
  // worker — nunca o IndexedDB nem o localStorage (os dados ficam).
  (function () {
    var done = false;
    function show(loadError) {
      var root = document.getElementById('app');
      if (done || !root || !root.querySelector('.boot-splash')) return;
      if (window.DM && (window.DM.ready === true || window.DM.error)) return;
      done = true;
      var box = document.createElement('div');
      box.className = 'boot-error';
      box.setAttribute('role', loadError ? 'alert' : 'status');
      box.setAttribute('data-boot-watchdog', loadError ? 'load' : 'timeout');
      box.innerHTML = '<div class="boot-error-card"><div class="boot-error-title"></div><p class="boot-error-hint"></p>' +
        '<div class="boot-error-actions" style="gap:8px;flex-wrap:wrap"><button type="button" class="btn">Limpar cache e recarregar</button>' +
        '<button type="button" class="btn btn-primary">Recarregar</button></div></div>';
      box.querySelector('.boot-error-title').textContent = loadError ? 'Não foi possível carregar o Demand Manager' : 'Está demorando mais que o normal…';
      box.querySelector('.boot-error-hint').textContent = loadError
        ? 'Um arquivo do aplicativo falhou ao carregar (talvez uma atualização pela metade ou falta de conexão).'
        : 'O Demand Manager ainda está abrindo — esta tela some sozinha quando terminar. Se não sair daqui, recarregue; ' +
          'se continuar, limpe o cache do aplicativo (seus dados não são apagados).';
      var buttons = box.querySelectorAll('button');
      buttons[1].onclick = function () { location.reload(); };
      buttons[0].onclick = function () {
        var jobs = [];
        try {
          if (window.caches) jobs.push(caches.keys().then(function (names) {
            return Promise.all(names.filter(function (n) { return n.indexOf('dm-shell') === 0; }).map(function (n) { return caches.delete(n); }));
          }));
          if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          }));
        } catch (e) { /* segue para o recarregamento */ }
        Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
      };
      root.replaceChildren(box);
      if (!loadError) {
        // O app pode terminar de abrir depois do aviso (rede lenta): aí o aviso sai sozinho.
        var watch = setInterval(function () {
          if (!box.isConnected) { clearInterval(watch); return; }
          if (window.DM && window.DM.ready === true) { clearInterval(watch); box.remove(); }
        }, 250);
      }
    }
    // Erros antes de o boot começar (window.DM ainda não existe): módulo que não carregou (evento no <script>,
    // capturado) ou exceção ao avaliar um módulo. config.js é opcional e não conta.
    window.addEventListener('error', function (e) {
      var t = e.target;
      var src = t && t.tagName === 'SCRIPT' ? t.src : e.filename || '';
      if (t && t !== window && t.tagName !== 'SCRIPT') return;
      if (/\/config\.js(\?|$)/.test(src)) return;
      setTimeout(function () { if (!window.DM) show(true); }, 1500);
    }, true);
    setTimeout(function () { show(false); }, window.__DM_BOOT_TIMEOUT_MS__ || 10000);
  })();
</script>
<script src="config.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
